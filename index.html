<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#330000"><title>DMZ: REGIA MASTER v4.1</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-master.png">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    body{margin:0;padding:0;background:#050000;font-family:'Share Tech Mono',monospace;color:#0f0;overflow-y:auto;}
    .full-screen-ui{width:100%;min-height:100vh;background:radial-gradient(circle at center,#1a0505 0%,#000 100%);display:flex;flex-direction:column;align-items:center;padding:30px 0 60px 0;}
    h1{color:#ff0;text-shadow:0 0 15px #ff0;font-size:32px;letter-spacing:4px;margin-bottom:5px;}
    .status-label{font-size:18px;font-weight:bold;margin-bottom:20px;padding:10px;border:1px solid #f00;color:#f00;text-align:center;width:80%;max-width:300px;background:rgba(255,0,0,0.1);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
    .status-label.running{border-color:#0f0;color:#0f0;background:rgba(0,255,0,0.1);}
    .input-box{background:rgba(20,0,0,0.8);border:1px solid #f00;color:#fff;padding:15px;margin:8px;width:80%;max-width:300px;text-align:center;font-size:16px;font-family:'Share Tech Mono',monospace;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);outline:none;}
    .btn-deploy{background:linear-gradient(135deg,#440000 0%,#110000 100%);color:#fff;border:1px solid #f00;padding:15px;font-size:18px;font-family:'Share Tech Mono',monospace;cursor:pointer;margin-top:15px;width:80%;max-width:300px;clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;background:rgba(20,0,0,0.5);padding:12px;border:1px solid #550000;margin-top:15px;width:80%;max-width:300px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
    .switch{position:relative;display:inline-block;width:50px;height:24px;} .switch input{opacity:0;width:0;height:0;} .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#333;transition:.4s;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);} .slider:before{position:absolute;content:"";height:16px;width:16px;left:4px;bottom:4px;background-color:white;transition:.4s;} input:checked+.slider{background-color:#f00;} input:checked+.slider:before{transform:translateX(26px);background-color:#000;}
    .cfg-box{background:rgba(10,0,0,0.8);border:1px solid #444;width:80%;max-width:300px;padding:15px;display:none;flex-direction:column;gap:10px;margin-top:-5px;}
    .cfg-label{color:#aaa;font-size:11px;text-align:left;}
    .cfg-input-edit{background:transparent;border:1px dashed #555;color:#fff;width:45px;text-align:center;font-family:monospace;}
    #tactical-alert-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(5px);z-index:9999;display:none;justify-content:center;align-items:center;}
    #tactical-alert-box{background:#0a0505;border:2px solid #f00;padding:25px;width:85%;max-width:320px;text-align:center;box-shadow:0 0 30px rgba(255,0,0,0.5);clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px);}
    .tactical-btn{background:#300;border:1px solid #f00;color:#fff;padding:10px 15px;font-family:'Share Tech Mono',monospace;cursor:pointer;flex:1;} .tactical-btn-ok{background:#030;border-color:#0f0;color:#0f0;}
</style>
</head>
<body>

<div id="tactical-alert-overlay"><div id="tactical-alert-box"><h3 id="tactical-alert-title" style="color:#f00;border-bottom:1px solid #f00;padding-bottom:5px;">SYSTEM</h3><div id="tactical-alert-msg" style="margin-bottom:20px;font-size:14px;white-space:pre-line;"></div><div id="tactical-alert-btns" style="display:flex;gap:10px;"></div></div></div>

<div id="master-screen" class="full-screen-ui">
    <h1>DMZ REGIA</h1><div class="version-tag">MASTER CORE v4.1 STABILE</div>
    <div id="status-label" class="status-label">CONNESSIONE...</div>

    <div class="cfg-label" style="width:80%;max-width:300px;">PRESET DI GIOCO:</div>
    <select id="config-slot" class="input-box" style="border-color:#ff5555;color:#ff5555;margin-top:5px;"><option value="BATTLE_ROYALE">BATTLE ROYALE</option><option value="MALLOPPO">MALLOPPO</option></select>
    <div style="display:flex;width:80%;max-width:300px;gap:10px;margin-bottom:20px;"><button class="btn-deploy" style="padding:10px;font-size:12px;width:50%;" onclick="saveConfig()">💾 SALVA</button><button class="btn-deploy" style="padding:10px;font-size:12px;width:50%;border-color:#0cf;" onclick="loadConfig()">📂 CARICA</button></div>

    <div class="cfg-label" style="width:80%;max-width:300px;">CAMPO OPERATIVO:</div>
    <select id="m-field" class="input-box" style="border-color:#ff0;color:#ff0;"><option value="campo1">CAMPO 1: DMZ ORIGINALE</option></select>

    <div class="cfg-label" style="width:80%;max-width:300px;margin-top:15px;color:#ff0;">TEMPO MAX PARTITA (MINUTI):</div>
    <input type="number" id="cfg-game-time" class="input-box" style="border-color:#ff0;color:#ff0;margin-top:5px;" value="45">

    <div class="toggle-row"><span style="color:#0cf;font-weight:bold;">ZAINO E LOOT 🎒</span><label class="switch"><input type="checkbox" id="cfg-backpack-toggle" checked onchange="toggleBackpackMenu()"><span class="slider"></span></label></div>
    <div id="backpack-settings" class="cfg-box" style="display:flex;border-color:#0cf;">
        <select id="cfg-start-mode" class="input-box" style="width:100%;margin:0;padding:8px;font-size:12px;" onchange="updateStartModeUI()"><option value="none">NESSUNO</option><option value="choice" selected>A SCELTA</option></select>
        <div id="cfg-start-limit-box"><div class="cfg-label">OGGETTI MAX:</div><input type="number" id="cfg-start-limit" class="input-box" style="width:100%;margin:0;padding:8px;" value="2"></div>
    </div>

    <div class="toggle-row"><span style="color:#8f8;font-weight:bold;">ECONOMIA 💵</span><label class="switch"><input type="checkbox" id="cfg-eco-toggle" checked><span class="slider"></span></label></div>
    
    <div class="toggle-row"><span style="color:#e6b800;font-weight:bold;">ARMADIETTI (A) 📦</span><label class="switch"><input type="checkbox" id="cfg-lockers-toggle" checked onchange="toggleLockerMenu()"><span class="slider"></span></label></div>
    <div id="locker-settings" class="cfg-box" style="display:flex;"><label style="color:#ffd700;font-size:13px;"><input type="checkbox" id="cfg-keys-lockers" checked> ARMADIETTI CON CHIAVE</label></div>

    <div class="toggle-row"><span style="color:#0ff;font-weight:bold;">RADAR UAV 📡</span><label class="switch"><input type="checkbox" id="cfg-uav-toggle" checked onchange="toggleUavMenu()"><span class="slider"></span></label></div>
    <div id="uav-settings" class="cfg-box" style="display:flex;"><select id="cfg-uav-mode" class="input-box" style="width:100%;margin:0;padding:8px;"><option value="none" selected>SPENTO</option><option value="always">SEMPRE ATTIVO</option><option value="periodic">PERIODICO</option></select></div>

    <div class="toggle-row"><span style="color:#ffa500;font-weight:bold;">MEDICO 🏥</span><label class="switch"><input type="checkbox" id="cfg-medic-toggle" checked onchange="toggleMedicMenu()"><span class="slider"></span></label></div>
    <div id="medic-settings" class="cfg-box" style="display:flex;"><div class="cfg-label">MAX RIANIMAZIONI:</div><input type="number" id="cfg-medic-revives" class="input-box" style="width:100%;margin:0;padding:8px;" value="1"></div>

    <div class="toggle-row"><span style="color:#f0f;font-weight:bold;">GAS DINAMICO ☢️</span><label class="switch"><input type="checkbox" id="cfg-gas-toggle"><span class="slider"></span></label></div>

    <div class="toggle-row"><span style="color:#e6e6fa;font-weight:bold;">CONTRATTI (B) 📜</span><label class="switch"><input type="checkbox" id="cfg-contracts-toggle" checked onchange="toggleContractsMenu()"><span class="slider"></span></label></div>
    <div id="contracts-settings" class="cfg-box" style="display:flex;"><label style="color:#ffd700;"><input type="checkbox" id="cfg-keys-bases"> CHIAVI PER LE BASI</label></div>

    <div class="toggle-row"><span style="color:#0ff;font-weight:bold;">ESFILTRAZIONE 🚁</span><label class="switch"><input type="checkbox" id="cfg-exfil-toggle" checked onchange="toggleExfilMenu()"><span class="slider"></span></label></div>
    <div id="exfil-settings" class="cfg-box" style="display:flex;">
        <div class="cfg-label">TEMPO ELICOTTERO (MIN):</div><input type="number" id="cfg-exfil-wait" class="input-box" style="width:100%;margin:0;padding:8px;" value="2">
        <select id="cfg-exfil-pos" class="input-box" style="width:100%;margin:0;padding:8px;"><option value="defined">Punti Fissi (C1)</option></select>
    </div>

    <button class="btn-deploy" style="background:linear-gradient(135deg,#008800 0%,#003300 100%);border-color:#0f0;margin-top:40px;" onclick="masterStartGame()">🚀 AVVIA PARTITA</button>
    <button class="btn-deploy" style="background:rgba(255,0,0,0.2);border-color:#f00;margin-top:20px;margin-bottom:50px;" onclick="masterStopGame()">⏹ TERMINA PARTITA</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, update, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
    const app = initializeApp({ apiKey: "AIzaSyCggNlC5bOdGVBzUsfX8wO4ygkNzNcFFm0", authDomain: "softair-dmz.firebaseapp.com", databaseURL: "https://softair-dmz-default-rtdb.firebaseio.com", projectId: "softair-dmz" });
    const db = getDatabase(app);

    window.tacticalAlert = function(msg, title = "INFO") { document.getElementById('tactical-alert-title').innerText = title; document.getElementById('tactical-alert-msg').innerText = msg; document.getElementById('tactical-alert-btns').innerHTML = `<button class="tactical-btn tactical-btn-ok" onclick="document.getElementById('tactical-alert-overlay').style.display='none'">OK</button>`; document.getElementById('tactical-alert-overlay').style.display = 'flex'; };
    window.tacticalConfirm = function(msg, cb) { document.getElementById('tactical-alert-title').innerText = "CONFERMA"; document.getElementById('tactical-alert-msg').innerText = msg; window.tmpCb = cb; document.getElementById('tactical-alert-btns').innerHTML = `<button class="tactical-btn tactical-btn-ok" onclick="document.getElementById('tactical-alert-overlay').style.display='none';window.tmpCb();">SI</button><button class="tactical-btn" onclick="document.getElementById('tactical-alert-overlay').style.display='none'">NO</button>`; document.getElementById('tactical-alert-overlay').style.display = 'flex'; };

    window.toggleBackpackMenu=()=>document.getElementById('backpack-settings').style.display=document.getElementById('cfg-backpack-toggle').checked?'flex':'none';
    window.toggleLockerMenu=()=>document.getElementById('locker-settings').style.display=document.getElementById('cfg-lockers-toggle').checked?'flex':'none';
    window.toggleUavMenu=()=>document.getElementById('uav-settings').style.display=document.getElementById('cfg-uav-toggle').checked?'flex':'none';
    window.toggleMedicMenu=()=>document.getElementById('medic-settings').style.display=document.getElementById('cfg-medic-toggle').checked?'flex':'none';
    window.toggleContractsMenu=()=>document.getElementById('contracts-settings').style.display=document.getElementById('cfg-contracts-toggle').checked?'flex':'none';
    window.toggleExfilMenu=()=>document.getElementById('exfil-settings').style.display=document.getElementById('cfg-exfil-toggle').checked?'flex':'none';
    window.updateStartModeUI=()=>document.getElementById('cfg-start-limit-box').style.display=(document.getElementById('cfg-start-mode').value==='choice')?'block':'none';

    window.masterStartGame = function() {
        let maxGameMinutes = parseInt(document.getElementById('cfg-game-time').value) || 45;
        let waitM = parseInt(document.getElementById('cfg-exfil-wait').value) || 2;
        update(ref(db, 'dmz_settings'), {
            status: 'running', activeField: document.getElementById('m-field').value, gameEndTime: Date.now() + (maxGameMinutes * 60000),
            backpack_active: document.getElementById('cfg-backpack-toggle').checked, economy_active: document.getElementById('cfg-eco-toggle').checked,
            lockers_active: document.getElementById('cfg-lockers-toggle').checked, keys_bases: document.getElementById('cfg-keys-bases').checked, keys_lockers: document.getElementById('cfg-keys-lockers').checked,
            exfil_config: { enabled: document.getElementById('cfg-exfil-toggle').checked, waitTime: waitM, position: document.getElementById('cfg-exfil-pos').value, points: [ { id: "C1", lat: 45.6800, lng: 9.8966, label: "EXFIL C1" } ] }
        }).then(() => {
            set(ref(db, 'dmz_exfils'), null); set(ref(db, 'dmz_lockers'), null); set(ref(db, 'dmz_streaks'), null); set(ref(db, 'dmz_logs'), null);
            tacticalAlert("PARTITA INIZIATA SUI TERMINALI.", "ONLINE");
        });
    };
    
    window.masterStopGame = function() { tacticalConfirm("Terminare la Partita per tutti?", () => { update(ref(db, 'dmz_settings'), { status: 'lobby' }); set(ref(db, 'dmz_players'), null); }); };

    window.onload = function() {
        onValue(ref(db, 'dmz_settings'), (snap) => {
            let data = snap.val(); let sl = document.getElementById('status-label');
            if(data && sl) { if (data.status === 'running') { sl.innerText = "🟢 PARTITA IN CORSO"; sl.className = "status-label running"; } else { sl.innerText = "🔴 IN ATTESA DI AVVIO"; sl.className = "status-label"; } }
        });
    };
</script>
</body>
</html>
